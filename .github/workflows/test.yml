name: test

# Fast-feedback lane: unit + integration tests via `go test ./...` per package.
# These tests run in-process (no Docker), so they finish in under a minute.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: test (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [chain, inference-node, indexer, determinism-harness]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true
          cache-dependency-path: ${{ matrix.pkg }}/go.sum

      - name: verify go.sum is in sync (no `go mod tidy` drift)
        working-directory: ${{ matrix.pkg }}
        # If a commit forgets to run `go mod tidy`, this step fails loudly
        # before the test step does — and the message points at the drift,
        # not at a confusing "missing go.sum entry" build error.
        run: |
          cp go.sum go.sum.before
          go mod tidy
          diff -u go.sum.before go.sum || { echo "✗ go.sum is stale; run 'go mod tidy' and commit the result" >&2; exit 1; }

      - name: go test
        working-directory: ${{ matrix.pkg }}
        # -race enabled for everything. -race requires CGO, which the bookworm
        # base image provides (the alpine base disables CGO).
        # -count=1 disables the test cache to ensure we exercise the code on
        # every CI run, not just on the first one with a given hash.
        # 10m timeout is generous — current full suite runs in <60s locally.
        run: go test -race -count=1 -timeout 10m ./...
