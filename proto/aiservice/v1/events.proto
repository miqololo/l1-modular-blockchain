syntax = "proto3";
package aios.aiservice.v1;

import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "aiservice/v1/types.proto";

option go_package = "github.com/aios/aios/x/aiservice/types";

// EventServiceRegistered is emitted when a new service joins the marketplace.
message EventServiceRegistered {
  uint64 service_id = 1;
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  cosmos.base.v1beta1.Coin price = 4 [(gogoproto.nullable) = false];
}

// EventInferenceRequested is emitted when a requester escrows funds and asks
// for inference work. The inference-node watches for this event.
message EventInferenceRequested {
  uint64 request_id = 1;
  uint64 service_id = 2;
  string requester = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string input_hash = 4;
  string input_uri = 5;
  cosmos.base.v1beta1.Coin escrow = 6 [(gogoproto.nullable) = false];
  int64 deadline_height = 7;
}

// EventResultSubmitted is emitted when a provider submits a result.
// Phase 0.5: immediately followed by EventRequestFinalized (no challenge window).
message EventResultSubmitted {
  uint64 request_id = 1;
  string provider = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string output_hash = 3;
  string output_uri = 4;
}

// EventRequestFinalized is emitted when a request transitions to FINALIZED
// (challenge window closed or, in Phase 0.5, immediately on submit).
// Escrow has been released to the provider at this point.
message EventRequestFinalized {
  uint64 request_id = 1;
  string provider = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin paid = 3 [(gogoproto.nullable) = false];
}

// EventRequestRefunded is emitted when a request's deadline elapsed
// without a submitted result. The requester's escrow is returned.
message EventRequestRefunded {
  uint64 request_id = 1;
  string requester = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin refunded = 3 [(gogoproto.nullable) = false];
}
