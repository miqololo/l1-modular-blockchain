syntax = "proto3";
package aios.aiservice.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "aiservice/v1/types.proto";

option go_package = "github.com/aios/aios/x/aiservice/types";

// Msg defines the aiservice Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterService registers a new AI service on the marketplace.
  rpc RegisterService(MsgRegisterService) returns (MsgRegisterServiceResponse);

  // RequestInference escrows payment and creates an inference request.
  rpc RequestInference(MsgRequestInference) returns (MsgRequestInferenceResponse);

  // SubmitResult records a provider's response to an inference request.
  rpc SubmitResult(MsgSubmitResult) returns (MsgSubmitResultResponse);

  // UpdateParams updates module parameters via governance.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgRegisterService is sent by a provider to register a new service.
message MsgRegisterService {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "aios/x/aiservice/MsgRegisterService";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string description = 3;
  cosmos.base.v1beta1.Coin price = 4 [(gogoproto.nullable) = false];
}

message MsgRegisterServiceResponse {
  uint64 service_id = 1;
}

// MsgRequestInference is sent by a requester to ask for inference work.
// The chain locks max_price from the requester's balance into escrow.
message MsgRequestInference {
  option (cosmos.msg.v1.signer) = "requester";
  option (amino.name) = "aios/x/aiservice/MsgRequestInference";

  string requester = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 service_id = 2;
  string input_hash = 3;
  string input_uri = 4;
  cosmos.base.v1beta1.Coin max_price = 5 [(gogoproto.nullable) = false];
  // deadline_height is an absolute block height by which a result must be submitted.
  // 0 means "use default" (current height + Params.max_request_deadline_blocks).
  int64 deadline_height = 6;
}

message MsgRequestInferenceResponse {
  uint64 request_id = 1;
}

// MsgSubmitResult is sent by a provider after running inference off-chain.
message MsgSubmitResult {
  option (cosmos.msg.v1.signer) = "provider";
  option (amino.name) = "aios/x/aiservice/MsgSubmitResult";

  string provider = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 request_id = 2;
  Result result = 3 [(gogoproto.nullable) = false];
}

message MsgSubmitResultResponse {}

// MsgUpdateParams is gov-only.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "aios/x/aiservice/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateParamsResponse {}
