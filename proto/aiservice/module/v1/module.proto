syntax = "proto3";
package aios.aiservice.module.v1;

import "cosmos/app/v1alpha1/module.proto";

// Module is the app config object of the aiservice module.
message Module {
  option (cosmos.app.v1alpha1.module) = {
    go_import: "github.com/aios/aios/x/aiservice"
  };
  // authority defines the custom module authority (governance by default).
  string authority = 1;
}
